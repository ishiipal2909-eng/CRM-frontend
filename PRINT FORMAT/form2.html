<head>

body{

}

        <option>8</option>
        <option>9</option>

        <option>11</option>
        <option>12</option>
</select>
</div>
<div class="formgroup">
<label>Details</label>
<textarea></textarea>
</div>
 <div class="button">
<input type="reset" value="reset">
<input type="button" value="Save">
</div>
</form>
</div>
